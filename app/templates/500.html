{% extends "base.html" %}

{% block title %}Server Error - {{ app_name }}{% endblock %}

{% block content %}
<div class="container py-5 text-center mt-5">
    <h1 class="display-1 fw-bold text-danger mb-3">500</h1>
    <h2 class="h3 mb-4">Internal Server Error</h2>
    <p class="lead mb-5 text-muted">Sorry, something went wrong on our end. Please try again later.</p>
    <a href="{{ url_for('main.home') }}" class="btn btn-primary btn-lg">
        <i class="bi bi-house me-2"></i>Return Home
    </a>
</div>
{% endblock %}

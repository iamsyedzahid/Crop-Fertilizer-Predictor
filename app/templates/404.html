{% extends "base.html" %}

{% block title %}404 Not Found - {{ app_name }}{% endblock %}

{% block content %}
<div class="container py-5 text-center mt-5">
    <h1 class="display-1 fw-bold text-success mb-3">404</h1>
    <h2 class="h3 mb-4">Page Not Found</h2>
    <p class="lead mb-5 text-muted">The page you are looking for doesn't exist or has been moved.</p>
    <a href="{{ url_for('main.home') }}" class="btn btn-primary btn-lg">
        <i class="bi bi-house me-2"></i>Return Home
    </a>
</div>
{% endblock %}
